{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block content %}
<ul class="d-flex list-unstyled flex-wrap row">
  {% for item in page_obj %}
    <li class="col-9 col-md-5 col-lg-3 my-1 flex-column mr-3">
      <div class="card">
        <div class="card-body"> 
          <a href="{% url 'catalog:subcategory_items' item.slug %}" class="mt-3 regular-link">
            <img class="card-img-top" src="{{ item.image.url }}" height="150" width="150">
          </a>
          <h5 class="mt-3 card-title">{{ item.title }} </h5>
        </div>   
    </div>
    </li>
  {% endfor %}
</ul>
{% endblock %}
