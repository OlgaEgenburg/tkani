{% extends "base.html" %}
{% load static %}
{% block content %}
<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{% url 'home:index' %}">Главная</a></li>
    <li class="breadcrumb-item active" aria-current="page">{{ category.title }}</li>
  </ol>
</nav>
<h1>Раздел «{{ category.title }}»</h1>
<p class="mb-5">{{ category.description }}</p>
<ul class="d-flex list-unstyled flex-wrap row">
    {% for item in item_list %}
    <li class="col-9 col-md-5 col-lg-3 my-1 flex-column mr-3">
      <div class="card">
        <div class="card-body"> 
          <a href="{% url 'catalog:category_items' item.slug %}" class="mt-3 regular-link">
            <img class="card-img-top" src="{{ item.image.url }}" height="150" width="150">
          </a>
          <h5 class="mt-3 card-title">{{ item.title }} </h5>
        </div>   
    </div>
    </li>
    {% endfor %}
  </ul>

{% endblock %}
