# docker-compose.production.yml
version: '3'

volumes:
  pg_data_production:
  static_volume:
  media:

services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data_production:/var/lib/postgresql/data
  backend:
    image: olgaegenburg/tkani_backend
    env_file: .env
    volumes:
      - static_volume:/backend_static
      - media:/app/media
  gateway:
    image: olgaegenburg/tkani_gateway
    env_file: .env
    volumes:
      - media:/media
      - static_volume:/staticfiles/
    ports:
      - 8000:80