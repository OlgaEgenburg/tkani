# docker-compose.production.yml
version: '3'

volumes:
  pg_data_production:
  static_volume:

services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data_production:/var/lib/postgresql/data
  backend:
    build: ./tkani/
    env_file: .env
    volumes:
      - static_volume:/backend_static
  gateway:
    build: ./gateway/
    volumes:
      - static_volume:/staticfiles
    ports:
      - 8000:80